# 复制为 config.toml 后修改（账号、AI 这几项也可以在控制面板右上角「设置」里填）。config.toml 含个人 token / key，不要进 git、不要外传。

# ---- 推荐 ----
position = 1          # 默认位置：1 一号位 / 2 中单 / 3 三号位 / 4 四号位 / 5 五号位（run 时控制面板可以改）
rank_min = 7          # 统计数据的段位范围：1 先锋 2 卫士 3 中军 4 统帅 5 传奇 6 万古流芳 7 超凡入圣 8 冠绝一世，0=不限
rank_max = 8
days = 14             # 统计最近几天的天梯全英雄选择对局；高分段对局少，建议 14（改了要重新 update）
account_id = 0        # Steam 好友代码：拉你的段位和近期英雄（游戏里要开「公开比赛数据」）
history_matches = 300 # 用最近多少局天梯判断「你的英雄」
stratz_token = ""     # STRATZ API token（stratz.com/api，Steam 登录后免费领）：分位置数据 + 你每局打的位置

pool = []             # 手写英雄池，例：["幻刺", "斧王", "Tidehunter"]；少量加分、不受位置筛选限制
only_pool = false     # true = 只在英雄池里推荐
position_filter = true
top = 3               # 「推荐」几个：按综合胜率排
top_other = 3         # 「针对这局」几个：综合前 top 个之外，按克制 + 配合挑（综合胜率 ≥ 50%）

# ---- 实时助手（python -m dota_assistant run）----
monitor = 1           # 截哪块屏幕：1 = 主屏，多屏时 2、3…
scan_interval = 1.0   # 识别间隔（秒）
match_threshold = 0.50  # 头像相似度下限（最高按 0.5 算），还要比第二像的英雄高出 0.15 才算认出；先用 recognize 看实际分数再调
gsi_port = 3000       # 改了要重新 gsi-install
dota_dir = ""         # Dota 安装目录（Steam 里右键 Dota 2 → 管理 → 浏览本地文件），留空自动找；找错了再填，手写用单引号：'E:\SteamLibrary\steamapps\common\dota 2 beta'（控制面板「设置」里也能填）
voice = false        # 语音播报先关着（面板开关也暂时隐藏），想听改成 true
voice_rate = 1        # 语速 -10 ~ 10
coach_voice = false   # 局内缺口提醒要不要念出来（先只弹卡片，F8 或点 × 关掉）
jungle_cues = true    # 野区计时提醒：四 / 五号位封野、拉野（双拉）、屯野，三 / 四 / 五号位 3、6 分钟抢莲花，会屯野的核心英雄提醒屯野；局内点 × 关掉这一局的这种提醒
stack_second = 53     # 屯野提醒：x:53 拉（大野 / 远古早 1~2 秒）
pull_second = 15      # 拉野提醒：x:15 拉；不同野点 / 阵营差几秒，实战里按自己那边调
buyback_timer = true  # 买活计时：游戏顶栏每个英雄头像下面一个小条，看到谁买活就点一下开始 8 分钟倒计时（再点取消）；自己的按 GSI 自动算
buyback_auto = true   # 买活自动记：比赛中每秒截一次 Dota 窗口看顶栏，有人复活时倒计时没走完就算买活、自动开始计时（认错了点小条取消）
ult_timer = true      # 对面大招冷却：对面头像下面买活小条再往下一条，看到他放大招（骷髅王是复活）就点一下开始倒计时（再点取消）；
                      # 大招等级按你自己的等级猜；右键弹菜单改等级、勾天赋 / 神杖 / 魔晶 / 玲珑心减冷却
ai_plan = true        # 本局要点里加「AI 打法」：前 / 中 / 后期怎么打、对线劣势怎么办
ai_provider = "claude_code"  # AI 来源：claude_code = 本机 Claude Code 订阅 / anthropic = 自己的 Anthropic API Key / openai = OpenAI 兼容接口
ai_model = "claude-opus-5-5" # 用 openai 时换成那家的模型名，例如 deepseek-chat
ai_api_key = ""       # anthropic / openai 要填（控制面板「设置」里也能填）
ai_base_url = ""      # openai 要填，例如 https://api.deepseek.com/v1
overlay_x = 0.80      # 叠加层左上角位置，占屏幕宽 / 高的比例（拖动过以后以 data/overlay.json 为准）
overlay_y = 0.22
overlay_width = 420     # 叠加层宽度；解锁后按住卡片右边缘的拉手也能拖宽（以 data/overlay.json 为准），≥640 时内容分左右两栏
overlay_opacity = 0.95  # 叠加层底色不透明度 0.3~1（1 = 完全不透明）；控制面板「叠加层」下面能直接拖着调
overlay_color = "#0a0d12" # 叠加层底色；文字是浅色，底色选深一点
hotkey_toggle = "F8"  # 显示 / 隐藏叠加层
hotkey_lock = "F7"    # 解锁叠加层（可以拖动）/ 固定位置
hotkey_rescan = "F9"  # 立即重新识别并播报
hotkey_shot = "F10"   # 保存全屏截图到 shots/
hotkey_brief = "F6"   # 再看一次本局要点（选完人自动弹出，号角响后收起）；和 Dota 里的按键冲突就换一个

# ---- 日志 ----
log_level = "INFO"    # 日志在 logs/ 下，每次启动一个文件、留最近 30 个；排查问题时改成 "DEBUG" 记得更细
