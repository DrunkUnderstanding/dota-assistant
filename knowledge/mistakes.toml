# AI 常见误判（进 git，换机器跟着走）。
# 打法页 AI 或开发助手说错、后来查 data/kb（Valve 官方原文）纠正的说法。
# 用途：kb hero / kb item 查询时一起显示；打法页把相关英雄的误判放进资料，让大模型别再犯。
# 记录：python -m dota_assistant kb mistake --wrong ... --right ... --hero ... --who 开发助手 --evidence ...
# wrong：错误说法；right：正确说法（要能在 kb 里查到）；who：打法页 AI / 开发助手；
# has_tag（可选）：英雄 / 物品确实有的机制标签，单元测试逐版本核对，版本改了机制会报出来。

[[mistake]]
wrong = "司夜刺客没有破坏技能，不能让复仇之魂的攻击光环失效"
right = "复仇以攻击打破隐身时对目标施加破坏效果，能让复仇之魂的复仇光环失效"
hero = "司夜刺客"
who = "开发助手"
date = "2026-10-23"
evidence = "复仇原文：如果司夜刺客以攻击打破隐身，当次攻击将造成超高额外伤害，并对目标施加破坏效果。"
has_tag = "施加破坏"
