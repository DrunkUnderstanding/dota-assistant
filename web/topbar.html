<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>选人助手 · 买活 / 大招计时</title>
<link rel="stylesheet" href="base.css">
<style>
  /* 透明窗口盖在屏幕最上面一条（整屏宽），每个英雄头像正下方一个买活小条，对面的再往下一个大招小条；
     只有小条接鼠标，其余地方点穿（Electron 那边按报上去的区域切） */
  html, body { background: transparent; overflow: hidden; height: 100%; }
  /* ?preview=1：浏览器里预览，垫一条像顶栏的底色、塞几条假数据 */
  body.preview { background: linear-gradient(180deg, #1d2430 0, #1d2430 calc(40px * var(--s)), #2c3a2a calc(40px * var(--s))); }
  /* 小条 = 图标（买活是金币、大招是那个技能的图标）+ 文字；平时只有图标，冷却 / 好了才带字。图标下不到就只写字 */
  .bb {
    position: absolute; height: calc(24px * var(--s)); width: calc(60px * var(--s));
    padding: 0 calc(3px * var(--s)); display: flex; align-items: center; justify-content: center; gap: calc(3px * var(--s));
    cursor: pointer; overflow: hidden;
    font: 600 calc(12px * var(--s)) / 1 var(--num); font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
    border: 1px solid rgba(255, 255, 255, 0.12); border-radius: calc(4px * var(--s));
    background: rgba(10, 13, 18, 0.5); color: rgba(233, 237, 242, 0.38);
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .bb.zh { font-family: var(--font); font-weight: 400; font-size: calc(11px * var(--s)); }
  .bb:hover { color: var(--text); border-color: var(--gold); background: rgba(10, 13, 18, 0.85); }
  .bb .ic { flex: none; width: calc(18px * var(--s)); height: calc(18px * var(--s)); object-fit: cover; }
  .bb .ic[hidden], .bb .t:empty { display: none; }
  .bb:not(.ult) .ic { width: calc(22px * var(--s)); height: calc(22px * var(--s)); margin: 0 calc(-2px * var(--s)); }   /* 金币图四周留白多 */
  .bb.ult .ic { border-radius: calc(3px * var(--s)); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6); }
  .bb.idle .ic { opacity: 0.7; filter: saturate(0.6); transition: opacity 0.15s, filter 0.15s; }
  .bb.idle:hover .ic { opacity: 1; filter: none; }
  .bb .t { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bb.cooling { color: #ffe1dc; background: rgba(150, 44, 34, 0.88); border-color: rgba(229, 103, 92, 0.9); }
  .bb.ready { color: #062010; background: rgba(92, 199, 127, 0.92); border-color: var(--good); font-weight: 600; }
  .bb.auto { border-style: dashed; cursor: default; }
  .bb[hidden] { display: none; }
  /* 大招小条：对面大招在冷却 = 蓝（趁机打），好了 = 橙（小心）；没图标时平时写技能名 */
  .bb.ult.zh.idle { font-size: calc(10px * var(--s)); }
  .bb.ult.cooling { color: #dcebff; background: rgba(38, 86, 150, 0.88); border-color: rgba(94, 174, 234, 0.9); }
  .bb.ult.ready { color: #241300; background: rgba(235, 157, 76, 0.94); border-color: var(--risk); }
  .bb.ult.open { border-color: var(--gold); }
  /* 右键大招小条弹的菜单：大招等级 + 减冷却（对面有没有，玩家点开他看到了再勾） */
  .menu {
    position: absolute; width: calc(230px * var(--s)); padding: calc(6px * var(--s)) calc(8px * var(--s));
    font: 400 calc(12px * var(--s)) / 1.35 var(--font); color: var(--text);
    background: rgba(12, 16, 22, 0.96); border: 1px solid var(--line-strong); border-radius: calc(6px * var(--s));
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
  }
  .menu[hidden] { display: none; }
  .menu .head { display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--gold); }
  .menu .head span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu button {
    font: inherit; color: var(--text-dim); background: var(--surface-2); cursor: pointer;
    border: 1px solid var(--line); border-radius: calc(4px * var(--s)); padding: calc(2px * var(--s)) calc(6px * var(--s));
  }
  .menu button:hover { color: var(--text); border-color: var(--gold); }
  .menu button.on { color: #1b1300; background: var(--gold); border-color: var(--gold); font-weight: 600; }
  .menu .x { padding: 0 calc(5px * var(--s)); background: none; border: none; font-size: calc(14px * var(--s)); }
  .menu .row { display: flex; align-items: center; gap: calc(4px * var(--s)); margin-top: calc(5px * var(--s)); }
  .menu .mod { display: block; width: 100%; text-align: left; margin-top: calc(4px * var(--s)); }
  .menu .mod::before { content: '\2610  '; }
  .menu .mod.on::before { content: '\2611  '; }
  .menu .cd { margin-top: calc(6px * var(--s)); color: var(--text); font-family: var(--num); }
  .menu .note { color: var(--text-faint); font-size: calc(11px * var(--s)); }
  /* 选人时没认出来的格子：大招小条那一行显示「?」，点开从候选里挑这格是谁（挑了会记成模板，下次认得） */
  .bb.ask { color: var(--gold); border-style: dashed; border-color: rgba(214, 178, 94, 0.7); font: 600 calc(14px * var(--s)) / 1 var(--font); }
  .bb.ask:hover, .bb.ask.open { background: rgba(10, 13, 18, 0.9); border-style: solid; }
  /* 挑英雄菜单：先点属性（力量 / 敏捷 / 智力 / 全才，同 Dota 选人界面的分法），再把这个属性的英雄全列出来（6 列） */
  .menu.wide { width: calc(616px * var(--s)); }
  .menu .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: calc(5px * var(--s)); margin-top: calc(6px * var(--s)); }
  .menu .tabs button { padding: calc(4px * var(--s)) 0; font-weight: 600; text-align: center; }
  .menu .tabs button em { font-style: normal; font-weight: 400; color: var(--text-faint); margin-left: calc(4px * var(--s)); }
  .menu .tabs .str { color: #e5675c; } .menu .tabs .agi { color: #5cc77f; } .menu .tabs .int { color: #5eaeea; } .menu .tabs .all { color: var(--gold); }
  .menu .tabs button.on { color: #10141a; }
  .menu .tabs button.on em { color: rgba(16, 20, 26, 0.6); }
  .menu .tabs .str.on { background: #e5675c; border-color: #e5675c; } .menu .tabs .agi.on { background: #5cc77f; border-color: #5cc77f; }
  .menu .tabs .int.on { background: #5eaeea; border-color: #5eaeea; } .menu .tabs .all.on { background: var(--gold); border-color: var(--gold); }
  .menu .picks { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: calc(3px * var(--s)); margin-top: calc(6px * var(--s)); }
  .menu .picks button { display: flex; align-items: center; gap: calc(4px * var(--s)); min-width: 0; padding: calc(1px * var(--s)) calc(3px * var(--s)) calc(1px * var(--s)) calc(1px * var(--s)); text-align: left; }
  .menu .picks button.taken { border-color: rgba(214, 178, 94, 0.6); color: var(--text); }
  .menu .picks img { flex: none; width: calc(20px * var(--s)); height: calc(20px * var(--s)); border-radius: calc(3px * var(--s)); }
  .menu .picks span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu .ask-attr { margin-top: calc(8px * var(--s)); color: var(--text-dim); }
  .menu .foot { display: flex; align-items: center; gap: calc(6px * var(--s)); margin-top: calc(6px * var(--s)); }
  .menu .foot .note { flex: 1; }
</style>
</head>
<body>
<script type="module">
import { act, connect, getJSON } from './api.js';

// 位置按 1920×1080 的真实对局截图量的（2026-10-22，shots/ingame_coach.png）：顶栏头像高 40、间距 63，
// 天辉第 1 个中心在屏幕中线左边 391、夜魇第 1 个在右边 138（天辉总在左边）。Dota 界面按屏幕高度等比缩放，所以都乘 s = 屏幕高 / 1080。
// 假设 Dota 是「无边框窗口」占满叠加层那块屏（和叠加层一样）；没在别的分辨率 / 宽高比下量过。
// 小条宽 W、高 24（2026-10-26 玩家嫌 54×17 不好点，加大；两个头像之间只剩 3 像素空）。
// 买活小条从 y=69 起：头像下面 y 40~66 是 Dota 自己的复活倒计时框（shots/buyback/ 实战样本量的），2026-10-27 玩家说别挡住它。
// 大招小条在买活小条下面（ULT_TOP），只给对面；右键弹的菜单在它下面。Electron 那边窗口高 TOPBAR_HEIGHT 要盖得住
const W = 60, TOP = 69, ULT_TOP = 96, PITCH = 63, CENTER0 = { radiant: -391, dire: 138 };
const GOLD_ICON = '/icons/icons/gold.png';   // Python 那边第一次从 Valve CDN 下（webui.py）
const params = new URLSearchParams(location.search);
const preview = params.has('preview');
const s = Number(params.get('scale')) || screen.height / 1080 || 1;   // Electron 传 scale（屏幕逻辑高 / 1080）
document.documentElement.style.setProperty('--s', String(s));
if (preview) document.body.classList.add('preview');
const shell = window.overlayShell;   // Electron 预加载脚本给的；浏览器预览时没有

const pills = [];
for (const kind of ['buyback', 'ult', 'ask']) {
  for (const side of ['radiant', 'dire']) {
    for (let i = 0; i < 5; i++) {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'bb';
      el.hidden = true;
      el.style.left = `calc(50% + ${(CENTER0[side] + PITCH * i - W / 2) * s}px)`;
      el.style.top = `${(kind === 'buyback' ? TOP : ULT_TOP) * s}px`;
      // 「?」点开挑英雄；买活小条右键也能挑（认错了换人）；大招小条右键是等级 / 减冷却菜单
      if (kind === 'ask') el.addEventListener('click', () => toggleMenu(side, i, el, 'pick'));
      else el.addEventListener('click', () => send(kind, { side, index: i }));
      el.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        toggleMenu(side, i, el, kind === 'ult' ? 'ult' : 'pick');
      });
      const ic = document.createElement('img');
      ic.className = 'ic';
      ic.alt = '';
      ic.draggable = false;
      const t = document.createElement('span');
      t.className = 't';
      el.append(ic, t);
      document.body.append(el);
      const p = { el, ic, t, kind, side, i, text: '', cls: '', src: '', iconOk: false };
      ic.addEventListener('load', () => { p.iconOk = true; render(); });
      ic.addEventListener('error', () => { p.iconOk = false; render(); });
      pills.push(p);
    }
  }
}

// 右键菜单：哪一格、什么时候自动收起（没人动它 MENU_IDLE 毫秒；点外面会点穿到游戏里，页面收不到，只能这样收）
const MENU_IDLE = 10000;
const menuEl = document.createElement('div');
menuEl.className = 'menu';
menuEl.hidden = true;
document.body.append(menuEl);
let menu = null;   // { type: 'ult' 等级 / 减冷却 | 'pick' 这格是谁, side, i, until, attr 挑英雄时点了哪个属性 }
const ATTRS = [['str', '力量'], ['agi', '敏捷'], ['int', '智力'], ['all', '全才']];
const MENU_W = { ult: 236, pick: 622 };
// 英雄表（名字 / 图标 key / 属性）拿一次；快照里每格只给候选 id 的顺序
let heroes = {};
if (!preview) getJSON('/api/heroes').then((list) => { heroes = Object.fromEntries(list.map((h) => [h.id, h])); render(); }).catch(() => {});
menuEl.addEventListener('pointerdown', () => { if (menu) menu.until = Date.now() + MENU_IDLE; });
menuEl.addEventListener('contextmenu', (e) => e.preventDefault());

let state = preview ? demo() : { show: false };
connect((snap) => {
  state = snap.buyback || { show: false };
  if (preview && !state.show) state = demo();
  render();
}, () => {});

function demo() {
  // 预览用：天辉第 2 个刚买活、夜魇第 3 个冷却快好了、夜魇第 5 个刚好能买活；
  // 我在夜魇，对面（天辉）第 1 个末日刚放、第 3 个绝冥再生好了、第 5 个技能名很长（也没图标）
  const now = Date.now();
  const ult = (name, key, end, cd) => ({ hero: '', name, key, end, level: 2, fixed: false, cd, cds: `${cd + 10}/${cd}/${cd - 10}`,
    mods: [{ key: 'talent:x', label: '20 级天赋：-10秒 末日冷却', on: false }, { key: 'octarine', label: '玲珑心：-25% 冷却', on: false }] });
  const list = [['宙斯', 'zuus', 'int'], ['力丸', 'riki', 'agi'], ['撼地者', 'earthshaker', 'str'], ['破晓辰星', 'dawnbreaker', 'str'],
    ['死亡先知', 'death_prophet', 'all'], ['帕吉', 'pudge', 'str'], ['斧王', 'axe', 'str'], ['莉娜', 'lina', 'int'], ['米拉娜', 'mirana', 'all'],
    ['幽鬼', 'spectre', 'agi'], ['不朽尸王', 'undying', 'str'], ['潮汐猎人', 'tidehunter', 'str'], ['斯温', 'sven', 'str'],
    ['马格纳斯', 'magnataur', 'all'], ['敌法师', 'antimage', 'agi']].map(([name, key, attr], k) => ({ id: k + 1, key, name, attr }));
  heroes = Object.fromEntries(list.map((h) => [h.id, h]));
  const pick = { order: list.map((h) => h.id), taken: [1, 2, 3, 4, 5] };
  const slot = (end) => ({ name: '演示', end, me: false, auto: false, ult: null, pick });
  const slots = { radiant: [0, 1, 2, 3, 4].map(() => slot(null)), dire: [0, 1, 2, 3, 4].map(() => slot(null)) };
  slots.radiant[1].end = 1800 + 470;
  slots.dire[2].end = 1800 + 25;
  slots.dire[4].end = 1800 - 3;
  slots.radiant[0].ult = ult('末日', 'doom_bringer_doom', 1800 + 118, 130);
  slots.radiant[1].ult = ult('黑洞', 'enigma_black_hole', null, 170);
  slots.radiant[2].ult = ult('绝冥再生', 'skeleton_king_reincarnation', 1800 - 4, 150);
  slots.radiant[4].ult = ult('热血竞技场', 'no_such_ability', null, 95);   // 图标下不到：退回写字
  slots.radiant[3].name = '';   // 选人时没认出来：显示「?」
  return { show: true, anchor: now - 1800 * 1000, paused: null, ready_show: 30, ult_ready_show: 30,
           my_side: 'dire', buyback_on: true, slots };
}

// 浏览器预览：没有 Python 服务，菜单的勾选只改假数据
async function send(type, payload) {
  if (!preview) return act(type, payload);
  const u = state.slots?.[payload.side]?.[payload.index]?.ult;
  if (type === 'name_slot') {
    const d = state.slots[payload.side][payload.index];
    d.name = heroes[payload.hero_id]?.name || '';
    render();
  }
  if (type === 'ult_set' && u) {
    if (payload.level) Object.assign(u, { level: payload.level, fixed: true });
    const m = u.mods.find((x) => x.key === payload.mod);
    if (m) m.on = payload.on;
    render();
  }
  return { ok: true };
}

function toggleMenu(side, i, pill, type) {
  menu = menu && menu.side === side && menu.i === i && menu.type === type ? null
    : { type, side, i, until: Date.now() + MENU_IDLE, attr: null };
  if (menu) {
    const r = pill.getBoundingClientRect();
    menuEl.classList.toggle('wide', type === 'pick');
    menuEl.style.top = `${r.bottom + 4 * s}px`;
    menuEl.style.left = `${Math.max(0, Math.min(r.left, window.innerWidth - MENU_W[type] * s))}px`;
  }
  render();
}

// 图标没加载好（或下不到）就藏起来，只写字
function show(p, src, text, cls) {
  if (src !== p.src) {
    p.src = src;
    p.iconOk = false;
    if (src) p.ic.src = src; else p.ic.removeAttribute('src');
  }
  p.ic.hidden = !p.iconOk;
  if (text !== p.text) p.t.textContent = p.text = text;
  if (cls !== p.cls) p.el.className = p.cls = cls;
}

const mmss = (sec) => `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;

function render() {
  const clock = state.paused ?? (Date.now() - state.anchor) / 1000;
  for (const p of pills) {
    const d = state.show ? state.slots?.[p.side]?.[p.i] : null;
    const open = menu && menu.side === p.side && menu.i === p.i;
    if (p.kind === 'ult') { renderUlt(p, d?.ult, clock, open && menu.type === 'ult'); continue; }
    if (p.kind === 'ask') { renderAsk(p, d, open && menu.type === 'pick'); continue; }
    p.el.hidden = !d || state.buyback_on === false;
    if (p.el.hidden) continue;
    const left = d.end == null ? null : d.end - clock;
    let text = p.iconOk ? '' : '买活', cls = 'bb zh idle';
    if (left != null && left > 0) { text = mmss(Math.ceil(left)); cls = 'bb cooling'; }
    else if (left != null && left > -state.ready_show) { text = p.iconOk ? '可买' : '可买活'; cls = 'bb zh ready'; }
    if (d.auto) cls += ' auto';
    show(p, GOLD_ICON, text, cls);
    const who = d.name || (d.me ? '自己' : '这个英雄');
    p.el.title = d.auto ? `${who}：买活冷却按 GSI 自动算`
      : left != null && left > 0 ? `${who}买活冷却还剩 ${text}（点错了再点一下取消）`
      : `${who}买活了就点一下，开始 8 分钟倒计时`;
    if (d.name && !d.me) p.el.title += `\n右键：${d.name}认错了，换一个`;
  }
  renderMenu();
  reportHitRects();
}
setInterval(render, 250);

function renderAsk(p, d, open) {
  p.el.hidden = !d || !!d.name || d.me;
  if (p.el.hidden) return;
  show(p, '', '?', `bb ask${open ? ' open' : ''}`);
  p.el.title = '选人时没认出这格是谁：点一下挑（挑了会记住这格头像，下次认得）';
}

const btn = (text, cls, onClick, title = '') => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = cls;
  b.textContent = text;
  b.title = title;
  b.addEventListener('click', onClick);
  return b;
};

let menuKey = '';
function renderMenu() {
  const d = menu && state.show ? state.slots?.[menu.side]?.[menu.i] : null;
  const u = menu?.type === 'ult' ? d?.ult : d;
  if (!u || Date.now() > menu.until) menu = null;
  menuEl.hidden = !menu;
  if (!menu) { menuKey = ''; return; }
  const key = JSON.stringify(menu.type === 'ult' ? [menu.side, menu.i, u.level, u.fixed, u.cd, u.mods]
    : [menu.side, menu.i, menu.attr, d.name, d.pick, Object.keys(heroes).length]);
  if (key === menuKey) return;   // 每 0.25 秒都调，没变不重建（不然按钮在鼠标底下被换掉，点不着）
  menuKey = key;
  if (menu.type === 'pick') { renderPicker(d); return; }
  const { side, i } = menu;
  const head = document.createElement('div');
  head.className = 'head';
  const name = document.createElement('span');
  name.textContent = `${u.hero ? u.hero + ' · ' : ''}${u.name}`;
  head.append(name, btn('×', 'x', () => { menu = null; render(); }, '收起'));
  const lv = document.createElement('div');
  lv.className = 'row';
  lv.append('大招');
  for (const n of [1, 2, 3]) {
    lv.append(btn(`${n} 级`, u.level === n ? 'on' : '', () => send('ult_set', { side, index: i, level: n }),
      u.fixed ? '' : '现在是按你的等级猜的'));
  }
  const mods = (u.mods || []).map((m) => btn(m.label, `mod${m.on ? ' on' : ''}`,
    () => send('ult_set', { side, index: i, mod: m.key, on: !m.on })));
  const cd = document.createElement('div');
  cd.className = 'cd';
  cd.textContent = `冷却 ${u.cd} 秒（各级 ${u.cds}）`;
  const note = document.createElement('div');
  note.className = 'note';
  note.textContent = u.fixed ? '点开他看到了再勾；这局一直按这个算' : '等级是按你的等级猜的；点开他看到了再改 / 勾';
  menuEl.replaceChildren(head, lv, ...mods, cd, note);
}

// 「这格是谁」：先点属性，再把这个属性的英雄全列出来。顺序是 Python 排好的：选人网格里被选走、还没分到格子的（金边）在前，
// 再是别的，都按和这格头像像不像排
function renderPicker(d) {
  const { side, i } = menu;
  const head = document.createElement('div');
  head.className = 'head';
  const title = document.createElement('span');
  title.textContent = d.name ? `${d.name}认错了？这格是谁` : '这格是谁？';
  head.append(title, btn('×', 'x', () => { menu = null; render(); }, '收起'));
  const taken = new Set(d.pick?.taken || []);
  const all = (d.pick?.order || []).map((id) => heroes[id]).filter(Boolean);
  const tabs = document.createElement('div');
  tabs.className = 'tabs';
  for (const [a, label] of ATTRS) {
    const n = all.filter((h) => h.attr === a).length;
    const b = btn(label, `${a}${menu.attr === a ? ' on' : ''}`, () => { menu.attr = a; render(); });
    const em = document.createElement('em');
    em.textContent = String(n);
    b.append(em);
    tabs.append(b);
  }
  const parts = [head, tabs];
  if (menu.attr) {
    const grid = document.createElement('div');
    grid.className = 'picks';
    for (const h of all.filter((x) => x.attr === menu.attr)) {
      const b = btn('', taken.has(h.id) ? 'taken' : '', () => { menu = null; send('name_slot', { side, index: i, hero_id: h.id }); render(); },
        taken.has(h.id) ? `${h.name}（选人时被选走了）` : h.name);
      const img = document.createElement('img');
      img.alt = '';
      img.draggable = false;
      img.src = `/icons/heroes/icons/${h.key}.png`;
      img.addEventListener('error', () => img.remove());
      const t = document.createElement('span');
      t.textContent = h.name;
      b.append(img, t);
      grid.append(b);
    }
    parts.push(grid);
  } else {
    const ask = document.createElement('div');
    ask.className = 'ask-attr';
    ask.textContent = all.length ? '先点他是哪种属性，再从里面挑' : '英雄表还没拿到，到控制面板这一格填';
    parts.push(ask);
  }
  const foot = document.createElement('div');
  foot.className = 'foot';
  const note = document.createElement('span');
  note.className = 'note';
  note.textContent = '金边 = 选人时被选走的，排在前面；挑了会记住这格头像，下次认得';
  foot.append(note);
  parts.push(foot);
  menuEl.replaceChildren(...parts);
}

function renderUlt(p, u, clock, open) {
  p.el.hidden = !u;
  if (!u) return;
  const left = u.end == null ? null : u.end - clock;
  const src = u.key ? `/icons/abilities/${u.key}.png` : '';
  const icon = p.iconOk && src === p.src;
  let text = icon ? '' : u.name, cls = 'bb zh ult idle';
  if (left != null && left > 0) { text = mmss(Math.ceil(left)); cls = 'bb ult cooling'; }
  else if (left != null && left > -state.ult_ready_show) { text = icon ? '好了' : '大招好了'; cls = 'bb zh ult ready'; }
  if (open) cls += ' open';
  show(p, src, text, cls);
  const who = `${u.hero || '对面'}的${u.name}`;
  const on = (u.mods || []).filter((m) => m.on).map((m) => m.label.split('：')[0]);
  const lv = `按 ${u.level} 级${on.length ? ' + ' + on.join('、') : ''}算冷却 ${u.cd} 秒（各级 ${u.cds}${u.fixed ? '' : '，等级按你的等级猜的'}）`;
  const note = on.length ? '右键改等级 / 减冷却' : '没勾天赋 / 神杖 / 玲珑心减冷却，可能早好；右键改等级 / 勾减冷却';
  p.el.title = left != null && left > 0 ? `${who}还剩 ${text}（点错了再点一下取消）\n${lv}\n${note}`
    : left != null && left > -state.ult_ready_show ? `${who}冷却好了，小心\n${lv}`
    : `看到${who}放了就点一下开始倒计时\n${lv}\n${note}`;
}

// 可点区域 = 显示着的小条（买活 + 大招；自己那条 GSI 自动算，也报上去好看提示）+ 打开的菜单
let lastRects = '';
function reportHitRects() {
  const els = [...pills.filter((p) => !p.el.hidden).map((p) => p.el), ...(menuEl.hidden ? [] : [menuEl])];
  const rects = els.map((el) => el.getBoundingClientRect())
    .map((r) => ({ x: Math.floor(r.x), y: Math.floor(r.y), w: Math.ceil(r.width), h: Math.ceil(r.height) }));
  const key = JSON.stringify(rects);
  if (key === lastRects) return;
  lastRects = key;
  shell?.setHitRects(rects);
}
window.addEventListener('resize', () => { lastRects = ''; reportHitRects(); });
</script>
